name: haokan_shipin
description: 蓝果短剧，可切换数据源的个人短剧 App
publish_to: "none"
version: 1.0.1+20261118

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^14.6.2
  video_player: ^2.9.2
  wakelock_plus: ^1.3.2
  cached_network_image: ^3.4.1
  shared_preferences: ^2.3.3
  crypto: ^3.0.6
  dio: ^5.11.1
  pointycastle: ^3.9.1
  package_info_plus: ^10.2.2
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/app_icon.png
  adaptive_icon_background: assets/icon/app_icon_background.png
  adaptive_icon_foreground: assets/icon/app_icon_foreground.png
  adaptive_icon_foreground_inset: 16
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/sources.json
